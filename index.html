<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Naruto Blazing Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0d1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            touch-action: none;
            overflow: hidden;
        }

        h3 {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 8px;
        }

        /* ── Wrapper keeps canvas + HUD in sync ── */
        #gameWrapper {
            position: relative;
            width: min(800px, 98vw);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
            border: 2px solid #2a2a4a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px #111;
        }

        /* ── HUD overlay (pointer-events off except interactive items) ── */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Turn badge */
        #turnBadge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.55);
            border: 1px solid currentColor;
            transition: color 0.4s;
        }

        /* ── Bottom bar: support cards + ultimate ── */
        #bottomBar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            pointer-events: none;
        }

        #supportPanel {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .sup-card {
            position: relative;
            width: 64px;
            height: 52px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1c1c3a, #2a2a50);
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
            overflow: hidden;
            user-select: none;
        }
        .sup-card.ready      { border-color: #f1c40f; }
        .sup-card.cooldown   { border-color: #555; cursor: default; }
        .sup-card:active     { transform: scale(0.93); }

        .sup-card .sup-name  { font-size: 11px; font-weight: bold; line-height: 1; }
        .sup-card .sup-stat  { font-size: 9px; color: #aaa; margin-top: 2px; }

        /* Cooldown fill (bottom-up) */
        .sup-card .cd-fill {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #f1c40f;
            transition: height 0.3s;
            height: 0%;
        }

        /* Ultimate button */
        #ultBtn {
            pointer-events: auto;
            background: linear-gradient(135deg, #8b0000, #c0392b);
            border: 2px solid #e74c3c;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;
            text-align: center;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s, box-shadow 0.3s;
            white-space: nowrap;
        }
        #ultBtn.ready {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 0 18px rgba(231,76,60,0.9);
            animation: ultPulse 1.1s infinite;
        }
        @keyframes ultPulse {
            0%,100% { box-shadow: 0 0 10px rgba(231,76,60,0.5); }
            50%      { box-shadow: 0 0 28px rgba(231,76,60,1);   }
        }

        /* ── Log message ── */
        #log {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #f1c40f;
            text-align: center;
            min-height: 20px;
            text-shadow: 0 0 10px rgba(241,196,15,0.4);
            max-width: min(800px, 98vw);
            padding: 0 8px;
        }
    </style>
</head>
<body>

<h3>Naruto Blazing Clone</h3>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="440"></canvas>

    <div id="hud">
        <div id="turnBadge" style="color:#2ecc71">YOUR TURN</div>

        <div id="bottomBar">
            <div id="supportPanel">
                <div class="sup-card ready" id="sup0" onclick="callSupport(0)">
                    <span class="sup-name" style="color:#a29bfe">Sasuke</span>
                    <span class="sup-stat">ATK 85</span>
                    <div class="cd-fill" id="cd0" style="height:0%"></div>
                </div>
                <div class="sup-card ready" id="sup1" onclick="callSupport(1)">
                    <span class="sup-name" style="color:#fd79a8">Sakura</span>
                    <span class="sup-stat">ATK 60 / Heal</span>
                    <div class="cd-fill" id="cd1" style="height:0%"></div>
                </div>
            </div>

            <button id="ultBtn" onclick="triggerUltimate()">SECRET<br>JUTSU</button>
        </div>
    </div>
</div>

<div id="log">Drag Naruto into Madara's range to attack!</div>

<script>
// ================================================================
//  CANVAS SETUP
// ================================================================
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const logEl   = document.getElementById('log');
const ultBtn  = document.getElementById('ultBtn');
const turnBadge = document.getElementById('turnBadge');

const W = canvas.width;
const H = canvas.height;

// ================================================================
//  PARTICLE SYSTEM
// ================================================================
let particles = [];

function spawnParticles(x, y, color, n = 10, speed = 4) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = speed * (0.4 + Math.random() * 0.8);
        particles.push({
            x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            r: 2 + Math.random() * 5,
            color,
            alpha: 1,
            decay: 0.025 + Math.random() * 0.02
        });
    }
}

function tickParticles() {
    particles = particles.filter(p => p.alpha > 0.05);
    for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.90; p.vy *= 0.90;
        p.r  *= 0.96;
        p.alpha -= p.decay;
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
    }
}

// ================================================================
//  FLOATING DAMAGE TEXT
// ================================================================
let floats = [];

function spawnFloat(x, y, text, color = '#fff', size = 22) {
    floats.push({ x, y: y - 10, text, color, size, alpha: 1, vy: -1.8 });
}

function tickFloats() {
    floats = floats.filter(f => f.alpha > 0.05);
    for (const f of floats) { f.y += f.vy; f.alpha -= 0.022; }
}

function drawFloats() {
    ctx.textAlign = 'center';
    for (const f of floats) {
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.font = `bold ${f.size}px sans-serif`;
        ctx.strokeStyle = 'rgba(0,0,0,0.9)';
        ctx.lineWidth = 4;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
    }
}

// ================================================================
//  SCREEN-SHAKE
// ================================================================
let shake = 0;
function triggerShake(amount = 8) { shake = amount; }

// ================================================================
//  GAME STATE
// ================================================================
let stormGauge       = 0;
let hitCombo         = 0;
let playerTurn       = true;
let turnMoveUsed     = false;
let isUltActive      = false;
let gameOver         = false;

const lead = {
    name: 'Naruto',
    x: 160, y: H / 2,
    radius: 22,
    range: 115,
    color: '#e67e22', glow: '#f39c12',
    hp: 550, maxHp: 550,
    atk: 48
};

const enemy = {
    name: 'Madara',
    x: 630, y: H / 2,
    radius: 30,
    color: '#6e0000', glow: '#c0392b',
    hp: 1400, maxHp: 1400,
    atk: 45,
    flashTimer: 0
};

const supports = [
    {
        name: 'Sasuke',
        color: '#8e44ad', glow: '#a29bfe',
        atk: 85,
        heal: 0,
        radius: 18,
        // off-screen home (left edge)
        homeX: -70, homeY: H / 2 - 45,
        x: -70, y: H / 2 - 45,
        targetX: 0, targetY: 0,
        active: false, timer: 0,
        cdMax: 3, cdLeft: 0,
        cardEl: document.getElementById('sup0'),
        cdEl:   document.getElementById('cd0')
    },
    {
        name: 'Sakura',
        color: '#c0185a', glow: '#fd79a8',
        atk: 60,
        heal: 60,   // heals Naruto instead of extra dmg on assist
        radius: 18,
        homeX: -70, homeY: H / 2 + 45,
        x: -70, y: H / 2 + 45,
        targetX: 0, targetY: 0,
        active: false, timer: 0,
        cdMax: 2, cdLeft: 0,
        cardEl: document.getElementById('sup1'),
        cdEl:   document.getElementById('cd1')
    }
];

// ================================================================
//  DRAG INPUT
// ================================================================
let isDragging = false;
let dragOX = 0, dragOY = 0;
let dragSX = 0, dragSY = 0;

function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (cx - r.left) * (W / r.width),
        y: (cy - r.top)  * (H / r.height)
    };
}

function onStart(e) {
    if (!playerTurn || isUltActive || gameOver) return;
    if (turnMoveUsed) { log('You already moved! Wait for the enemy turn.'); return; }
    const p = toCanvas(e);
    if (Math.hypot(p.x - lead.x, p.y - lead.y) < lead.radius + 18) {
        isDragging = true;
        dragOX = p.x - lead.x;
        dragOY = p.y - lead.y;
        dragSX = lead.x;
        dragSY = lead.y;
    }
}

function onMove(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();
    const p = toCanvas(e);
    lead.x = clamp(p.x - dragOX, lead.radius, W - lead.radius);
    lead.y = clamp(p.y - dragOY, lead.radius, H - 80 - lead.radius); // avoid bottom bar
}

function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    if (Math.hypot(lead.x - dragSX, lead.y - dragSY) > 4) {
        turnMoveUsed = true;
        resolveAttack();
    }
}

canvas.addEventListener('mousedown',  onStart);
canvas.addEventListener('mousemove',  onMove);
window.addEventListener('mouseup',    onEnd);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove',  onMove,  { passive: false });
window.addEventListener('touchend',   onEnd);

// ================================================================
//  COMBAT LOGIC
// ================================================================
function resolveAttack() {
    const dist = Math.hypot(enemy.x - lead.x, enemy.y - lead.y);
    if (dist <= lead.range + enemy.radius) {
        hitCombo++;
        const dmg = lead.atk + rng(0, 18);
        dealDamage(dmg);
        addGauge(13);
        triggerShake(5);
        spawnParticles(enemy.x, enemy.y, '#f39c12', 12);
        spawnFloat(enemy.x, enemy.y - 40, `-${dmg}`, '#f1c40f', 24);
        log(`⚔️ Naruto strikes! ×${hitCombo} combo — ${dmg} DMG`);

        // auto-assist every 2 hits
        if (hitCombo % 2 === 0) {
            const idx = (Math.floor(hitCombo / 2) % 2 === 1) ? 0 : 1;
            if (supports[idx].cdLeft === 0 && !supports[idx].active) {
                setTimeout(() => assistSupport(idx), 400);
            }
        }
        setTimeout(endPlayerTurn, 900);
    } else {
        hitCombo = 0;
        log('Too far! Drag Naruto closer to Madara.');
        setTimeout(endPlayerTurn, 700);
    }
}

function dealDamage(dmg) {
    enemy.hp = Math.max(0, enemy.hp - dmg);
    enemy.flashTimer = 12;
    if (enemy.hp === 0 && !gameOver) {
        gameOver = true;
        setTimeout(() => log('🏆 VICTORY! Madara has been defeated!'), 300);
    }
}

function assistSupport(idx) {
    if (gameOver) return;
    const s = supports[idx];
    if (s.active) return;

    s.active = true;
    s.timer  = 50;
    s.x      = s.homeX;
    s.y      = s.homeY;
    s.targetX = enemy.x - 55 + rng(-10, 10);
    s.targetY = enemy.y      + rng(-25, 25);

    const dmg = s.atk + rng(0, 20);
    dealDamage(dmg);
    addGauge(9);
    triggerShake(4);
    spawnParticles(enemy.x, enemy.y, s.color, 10);
    spawnFloat(enemy.x + 20, enemy.y - 55, `-${dmg}`, s.glow, 20);

    // Sakura bonus: heal lead
    if (s.heal > 0) {
        const healAmt = s.heal;
        lead.hp = Math.min(lead.maxHp, lead.hp + healAmt);
        spawnParticles(lead.x, lead.y, '#2ecc71', 8);
        spawnFloat(lead.x, lead.y - 40, `+${healAmt} HP`, '#2ecc71', 16);
        log(`💥 ${s.name} assist! ${dmg} DMG — and heals Naruto for ${healAmt}!`);
    } else {
        log(`💥 ${s.name} dashes in for ${dmg} DMG!`);
    }
}

function callSupport(idx) {
    if (!playerTurn || gameOver || isUltActive) return;
    const s = supports[idx];
    if (s.cdLeft > 0) { log(`${s.name} recharging (${s.cdLeft} turns left)`); return; }
    if (s.active) return;

    assistSupport(idx);
    s.cdLeft = s.cdMax;
    refreshSupportUI(idx);
}

function endPlayerTurn() {
    if (gameOver) return;
    playerTurn   = false;
    turnMoveUsed = false;
    setBadge('ENEMY TURN', '#e74c3c');
    setTimeout(enemyTurn, 700);
}

function enemyTurn() {
    if (gameOver) return;
    const dist = Math.hypot(lead.x - enemy.x, lead.y - enemy.y);
    if (dist < 115) {
        const dmg = enemy.atk + rng(0, 18);
        lead.hp = Math.max(0, lead.hp - dmg);
        triggerShake(7);
        spawnParticles(lead.x, lead.y, '#e74c3c', 10);
        spawnFloat(lead.x, lead.y - 40, `-${dmg}`, '#e74c3c', 22);
        log(`💀 Madara attacks! Naruto takes ${dmg} DMG!`);

        if (lead.hp === 0 && !gameOver) {
            gameOver = true;
            setTimeout(() => log('💀 DEFEAT! Naruto has fallen...'), 300);
            return;
        }
    } else {
        log('Madara advances... stay alert!');
    }

    // Tick support cooldowns
    supports.forEach((s, i) => {
        if (s.cdLeft > 0) { s.cdLeft--; refreshSupportUI(i); }
    });

    setTimeout(beginPlayerTurn, 1000);
}

function beginPlayerTurn() {
    if (gameOver) return;
    playerTurn = true;
    setBadge('YOUR TURN', '#2ecc71');
    log('Your turn! Drag Naruto to attack.');
}

// ================================================================
//  ULTIMATE
// ================================================================
function addGauge(v) {
    stormGauge = Math.min(100, stormGauge + v);
    if (stormGauge >= 100) {
        ultBtn.className = 'ready';
        ultBtn.textContent = 'SECRET JUTSU!';
    }
}

function triggerUltimate() {
    if (isUltActive || gameOver) return;
    isUltActive = true;
    playerTurn  = false;
    stormGauge  = 0;
    ultBtn.className   = '';
    ultBtn.textContent = 'LOCKED';
    setBadge('SECRET JUTSU!', '#f1c40f');
    log('🌀 SECRET JUTSU — TRIPLE STRIKE!');

    // Slam Naruto next to enemy
    lead.x = enemy.x - 65;
    lead.y = enemy.y;

    supports.forEach((s, i) => {
        s.active = true; s.timer = 110;
        s.x = s.homeX; s.y = s.homeY;
        s.targetX = enemy.x - 80;
        s.targetY = enemy.y + (i === 0 ? -65 : 65);
    });

    spawnParticles(enemy.x, enemy.y, '#f1c40f', 25, 6);
    triggerShake(12);

    setTimeout(() => {
        const dmg = Math.floor(lead.atk * 3.8 + supports[0].atk * 2.5 + supports[1].atk * 2.5);
        dealDamage(dmg);
        spawnParticles(enemy.x, enemy.y, '#ffffff', 35, 7);
        spawnParticles(enemy.x, enemy.y, '#f1c40f', 20, 5);
        triggerShake(15);
        spawnFloat(enemy.x, enemy.y - 30, `-${dmg}`, '#f1c40f', 32);
        log(`✨ SECRET JUTSU — ${dmg} DMG!! Madara is staggered!`);

        setTimeout(() => {
            isUltActive = false;
            hitCombo = 0;
            if (!gameOver) beginPlayerTurn();
        }, 900);
    }, 1300);
}

// ================================================================
//  SUPPORT UI
// ================================================================
function refreshSupportUI(idx) {
    const s = supports[idx];
    if (s.cdLeft > 0) {
        s.cardEl.className = 'sup-card cooldown';
        s.cdEl.style.height = ((s.cdLeft / s.cdMax) * 100) + '%';
        s.cdEl.textContent = s.cdLeft;
    } else {
        s.cardEl.className = 'sup-card ready';
        s.cdEl.style.height = '0%';
        s.cdEl.textContent  = '';
    }
}

// ================================================================
//  DRAWING
// ================================================================
function drawBg() {
    // Dark field
    ctx.fillStyle = '#0f0f20';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Arena centre glow
    const ag = ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,320);
    ag.addColorStop(0, 'rgba(80,80,180,0.07)');
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, W, H);

    // Left support zone tint
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    ctx.fillRect(0, 0, 90, H);
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(90,0); ctx.lineTo(90,H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '8px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.textAlign = 'center';
    ctx.fillText('SUPPORT', 45, 18);
    ctx.fillText('ZONE', 45, 30);
}

function drawStormGauge() {
    const gx = W/2 - 90, gy = 8, gw = 180, gh = 13;
    // Track
    ctx.fillStyle = '#111';
    ctx.fillRect(gx-1, gy-1, gw+2, gh+2);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(gx, gy, gw, gh);

    // Fill
    const grad = ctx.createLinearGradient(gx, 0, gx+gw, 0);
    grad.addColorStop(0, '#f39c12');
    grad.addColorStop(1, '#e74c3c');
    ctx.fillStyle = grad;
    ctx.fillRect(gx, gy, (stormGauge/100)*gw, gh);

    // Label
    ctx.font = 'bold 8px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('STORM GAUGE', W/2, gy+10);
}

function drawRangeCircle() {
    if (!isDragging) return;
    const inRange = Math.hypot(enemy.x - lead.x, enemy.y - lead.y) <= lead.range + enemy.radius;

    // Range ring
    ctx.beginPath();
    ctx.arc(lead.x, lead.y, lead.range, 0, Math.PI*2);
    ctx.fillStyle = inRange ? 'rgba(46,204,113,0.06)' : 'rgba(243,156,18,0.05)';
    ctx.fill();
    ctx.setLineDash([6,5]);
    ctx.strokeStyle = inRange ? 'rgba(46,204,113,0.5)' : 'rgba(243,156,18,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);

    // Line to enemy
    ctx.beginPath();
    ctx.moveTo(lead.x, lead.y);
    ctx.lineTo(enemy.x, enemy.y);
    ctx.strokeStyle = inRange ? 'rgba(46,204,113,0.35)' : 'rgba(231,76,60,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawChar(x, y, r, baseColor, glowHex, name, isLead, flash) {
    // Soft outer glow
    const og = ctx.createRadialGradient(x, y, r*0.3, x, y, r*3);
    og.addColorStop(0, glowHex + '55');
    og.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(x, y, r*3, 0, Math.PI*2);
    ctx.fillStyle = og; ctx.fill();

    // Body
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    const bg = ctx.createRadialGradient(x-r*0.28, y-r*0.28, r*0.05, x, y, r);
    bg.addColorStop(0, lighten(baseColor, 55));
    bg.addColorStop(1, flash || baseColor);
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = flash ? '#fff' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = isLead ? 2.5 : 1.5;
    ctx.stroke();

    // Name
    ctx.textAlign = 'center';
    ctx.font = `bold ${isLead ? 12 : 10}px sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,1)';
    ctx.shadowBlur  = 5;
    ctx.fillText(name, x, y - r - 6);
    ctx.shadowBlur = 0;
}

function drawHpBar(x, y, w, hp, maxHp, col) {
    const bx = x - w/2, bh = 7;
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(bx-1, y-1, w+2, bh+2);
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, y, w, bh);
    const r = hp/maxHp;
    ctx.fillStyle = r > 0.5 ? col : r > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(bx, y, w*r, bh);

    ctx.font = '9px sans-serif';
    ctx.fillStyle = '#ccc';
    ctx.textAlign = 'center';
    ctx.fillText(`${hp}/${maxHp}`, x, y + bh + 11);
}

// ================================================================
//  MAIN LOOP
// ================================================================
function frame() {
    // Screen shake offset
    let sx = 0, sy = 0;
    if (shake > 0) {
        sx = (Math.random()*2-1) * shake;
        sy = (Math.random()*2-1) * shake;
        shake *= 0.8;
        if (shake < 0.5) shake = 0;
    }

    ctx.save();
    ctx.translate(sx, sy);

    drawBg();
    drawStormGauge();
    drawRangeCircle();

    // Combo counter
    if (hitCombo > 1) {
        ctx.font = `bold ${14 + hitCombo}px sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#f1c40f';
        ctx.globalAlpha = 0.85;
        ctx.fillText(`COMBO ×${hitCombo}`, 10, H - 80);
        ctx.globalAlpha = 1;
    }

    // Supports (animated off-screen → on-screen)
    for (const s of supports) {
        if (!s.active) continue;

        s.timer--;
        s.x += (s.targetX - s.x) * 0.14;
        s.y += (s.targetY - s.y) * 0.14;

        // When timer expires, rush back off-screen
        if (s.timer <= 0) {
            s.targetX = s.homeX;
            s.targetY = s.homeY;
            if (Math.abs(s.x - s.homeX) < 4) {
                s.active = false;
                s.x = s.homeX; s.y = s.homeY;
            }
        }

        drawChar(s.x, s.y, s.radius, s.color, s.glow, s.name, false, null);
    }

    // Enemy flash
    if (enemy.flashTimer > 0) enemy.flashTimer--;
    const eFlash = enemy.flashTimer > 0 ? '#ff4444' : null;
    drawChar(enemy.x, enemy.y, enemy.radius, enemy.color, enemy.glow, enemy.name, false, eFlash);
    drawHpBar(enemy.x, enemy.y + enemy.radius + 4, 110, enemy.hp, enemy.maxHp, '#2ecc71');

    // Lead
    drawChar(lead.x, lead.y, lead.radius, lead.color, lead.glow, lead.name, true, null);
    drawHpBar(lead.x, lead.y + lead.radius + 4, 90, lead.hp, lead.maxHp, '#3498db');

    // Particles + floats
    tickParticles(); drawParticles();
    tickFloats();    drawFloats();

    // Game-over overlay
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(-10, -10, W+20, H+20);
        const won = enemy.hp === 0;
        ctx.textAlign = 'center';
        ctx.font = 'bold 50px sans-serif';
        ctx.shadowColor = won ? '#f1c40f' : '#e74c3c';
        ctx.shadowBlur  = 30;
        ctx.fillStyle   = won ? '#f1c40f' : '#e74c3c';
        ctx.fillText(won ? 'VICTORY!' : 'DEFEAT', W/2, H/2);
        ctx.font = '16px sans-serif';
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#aaa';
        ctx.fillText('Refresh to play again', W/2, H/2 + 36);
    }

    ctx.restore();
    requestAnimationFrame(frame);
}

// ================================================================
//  HELPERS
// ================================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rng(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function log(msg) { logEl.textContent = msg; }

function setBadge(text, color) {
    turnBadge.textContent = text;
    turnBadge.style.color = color;
    turnBadge.style.borderColor = color;
}

function lighten(hex, amt) {
    const n = parseInt(hex.replace('#',''), 16);
    const r = Math.min(255, (n>>16) + amt);
    const g = Math.min(255, ((n>>8)&0xff) + amt);
    const b = Math.min(255, (n&0xff) + amt);
    return `rgb(${r},${g},${b})`;
}

// ================================================================
//  BOOT
// ================================================================
refreshSupportUI(0);
refreshSupportUI(1);
frame();
</script>
</body>
</html>
