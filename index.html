<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RIOT//SHIFT</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- battle HUD -->
  <div id="hud" hidden>
    <div id="enemyBars"></div>
    <div id="popups"></div>
    <div id="combo"></div>
    <div id="squadBar"></div>
  </div>
  <div id="cutin" hidden></div>

  <!-- tutorial -->
  <div id="dialog" hidden>
    <div class="dlg-tag">GUIDE</div>
    <div class="dlg-text"></div>
    <button class="dlg-next" hidden>NEXT ▶</button>
  </div>
  <div id="gestureHint" hidden><i></i></div>
  <button id="tutorialSkip" class="btn ghost" hidden>SKIP TUTORIAL ▶▶</button>
  <div id="elementChart" hidden>
    <div class="ec-title">ELEMENTS</div>
    <div class="ec-row"><b class="t-blaze">BLAZE</b><span>▶</span><b class="t-gale">GALE</b><span>▶</span><b class="t-tide">TIDE</b><span>▶</span><b class="t-blaze">BLAZE</b></div>
    <div class="ec-sub">Weakness ×1.5 · Resist ×0.75</div>
  </div>

  <!-- screens -->
  <section id="screen-title" class="screen" hidden>
    <div class="logo"><span>RIOT</span><em>//</em><span>SHIFT</span></div>
    <div class="tagline">STREET-LEVEL SQUAD BATTLES</div>
    <button id="btnStart" class="btn hot big">TAP TO START</button>
  </section>

  <section id="screen-home" class="screen" hidden>
    <header class="bar"><h2>HOME</h2><div class="gems">◆ <span id="homeGems">0</span></div></header>
    <div class="home-squad-label">YOUR SQUAD</div>
    <div id="homeSquad" class="home-squad"></div>
    <nav class="home-menu">
      <button id="btnBattle" class="btn hot big">STREET FIGHT</button>
      <button id="btnSummon" class="btn">SUMMON</button>
      <button id="btnTeam" class="btn">SQUAD</button>
      <button id="btnTutorial" class="btn ghost">REPLAY TUTORIAL</button>
    </nav>
  </section>

  <section id="screen-summon" class="screen" hidden></section>
  <section id="screen-pick" class="screen" hidden></section>
  <section id="screen-team" class="screen" hidden></section>
  <section id="screen-result" class="screen" hidden></section>

  <div id="placeholderNotice" hidden></div>
  <div id="loading">LOADING…</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
