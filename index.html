<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Naruto Blazing Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif; color: #fff;
            touch-action: none; overflow: hidden;
        }
        h3 { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #666; margin-bottom: 6px; }
        #gameWrapper { position: relative; width: min(800px, 98vw); }
        canvas { display: block; width: 100%; height: auto; border-radius: 6px; border: 2px solid #222; box-shadow: 0 20px 60px rgba(0,0,0,0.9); }
        #hud { position: absolute; inset: 0; pointer-events: none; }
        #turnBadge {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            padding: 3px 14px; border-radius: 20px; font-size: 11px; font-weight: bold;
            letter-spacing: 2px; background: rgba(0,0,0,0.65); border: 1px solid currentColor;
            transition: color 0.4s;
        }
        #bottomBar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 68px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            pointer-events: none;
        }
        #supportPanel { display: flex; gap: 8px; pointer-events: auto; }
        .sup-card {
            position: relative; width: 68px; height: 52px; border-radius: 8px;
            background: linear-gradient(135deg,#1a1a35,#26265a);
            border: 2px solid #444;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; user-select: none;
            transition: border-color .2s, transform .15s;
        }
        .sup-card.ready  { border-color: #f1c40f; box-shadow: 0 0 8px rgba(241,196,15,.35); }
        .sup-card.cd     { border-color: #333; cursor: default; }
        .sup-card:active { transform: scale(0.92); }
        .sup-card .sname { font-size: 11px; font-weight: bold; line-height: 1; }
        .sup-card .sstat { font-size: 9px; color: #aaa; margin-top: 2px; }
        .sup-card .cdfill {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,.65);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; color: #f1c40f;
            transition: height .3s; height: 0%;
        }
        #ultBtn {
            pointer-events: auto;
            background: linear-gradient(135deg,#5a0000,#b03020);
            border: 2px solid #e74c3c; color: #fff;
            padding: 8px 13px; border-radius: 8px; cursor: pointer;
            font-size: 10px; font-weight: bold; letter-spacing: 1px;
            text-transform: uppercase; line-height: 1.4; text-align: center;
            opacity: .3; pointer-events: none;
            transition: opacity .3s, box-shadow .3s; white-space: nowrap;
        }
        #ultBtn.ready {
            opacity: 1; pointer-events: auto;
            box-shadow: 0 0 20px rgba(231,76,60,.9);
            animation: uPulse 1.1s infinite;
        }
        @keyframes uPulse {
            0%,100% { box-shadow: 0 0 10px rgba(231,76,60,.4); }
            50%      { box-shadow: 0 0 32px rgba(231,76,60,1);  }
        }
        #log {
            margin-top: 10px; font-size: 13px; font-weight: bold;
            color: #f1c40f; text-align: center; min-height: 20px;
            text-shadow: 0 0 10px rgba(241,196,15,.4);
            max-width: min(800px,98vw); padding: 0 8px;
        }
    </style>
</head>
<body>
<h3>Naruto Blazing Clone</h3>
<div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="440"></canvas>
    <div id="hud">
        <div id="turnBadge" style="color:#2ecc71">YOUR TURN</div>
        <div id="bottomBar">
            <div id="supportPanel">
                <div class="sup-card ready" id="sup0" onclick="callSupport(0)">
                    <span class="sname" style="color:#a29bfe">Sasuke</span>
                    <span class="sstat">ATK 85</span>
                    <div class="cdfill" id="cd0" style="height:0%"></div>
                </div>
                <div class="sup-card ready" id="sup1" onclick="callSupport(1)">
                    <span class="sname" style="color:#fd79a8">Sakura</span>
                    <span class="sstat">ATK 60 / Heal</span>
                    <div class="cdfill" id="cd1" style="height:0%"></div>
                </div>
            </div>
            <button id="ultBtn" onclick="triggerUltimate()">SECRET<br>JUTSU</button>
        </div>
    </div>
</div>
<div id="log">Loading assets...</div>

<script>
// ── Canvas ────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const logEl  = document.getElementById('log');
const ultBtn = document.getElementById('ultBtn');
const badge  = document.getElementById('turnBadge');
const W = canvas.width, H = canvas.height;

// ── Helpers ───────────────────────────────────────────────────────
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const rng   = (lo,hi)   => lo + Math.floor(Math.random()*(hi-lo+1));
const log   = msg => logEl.textContent = msg;
function setBadge(t,c){ badge.textContent=t; badge.style.color=c; badge.style.borderColor=c; }

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
        this.beginPath();
        this.moveTo(x+r,y); this.lineTo(x+w-r,y);
        this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r);
        this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h);
        this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r);
        this.quadraticCurveTo(x,y,x+r,y); this.closePath();
    };
}

// ── Asset Loading ─────────────────────────────────────────────────
const bgImg     = new Image();
const narutoImg = new Image();
const madaraImg = new Image();
let assetsReady = 0;
const TOTAL_ASSETS = 3;

function onLoad(){ assetsReady++; if(assetsReady===TOTAL_ASSETS){ log('Drag Naruto into Madara\'s range to attack!'); gameReady=true; } }
bgImg.onload     = onLoad; bgImg.src     = 'bg.png';
narutoImg.onload = onLoad; narutoImg.src = 'naruto.png';
madaraImg.onload = onLoad; madaraImg.src = 'madara.png';

let gameReady = false;

// ── Particles ─────────────────────────────────────────────────────
let particles=[], jutsuRings=[], bolts=[];

function spawnPfx(x,y,color,n=10,spd=4,type='dot'){
    for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2, s=spd*(.4+Math.random()*.8);
        particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
            r:2+Math.random()*5,color,a:1,decay:.025+Math.random()*.02,
            type,rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.18});
    }
}

function spawnRasengan(x,y){
    for(let i=0;i<24;i++){
        const a=(i/24)*Math.PI*2, d=5+Math.random()*18;
        particles.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,
            vx:Math.cos(a+Math.PI/2)*(2+Math.random()*3),
            vy:Math.sin(a+Math.PI/2)*(2+Math.random()*3),
            r:3+Math.random()*4,color:Math.random()>.5?'#74b9ff':'#fff',
            a:1,decay:.018,type:'dot',rot:0,rotV:0});
    }
    jutsuRings.push({x,y,r:4,maxR:75,color:'#74b9ff',a:.9});
    jutsuRings.push({x,y,r:4,maxR:50,color:'#fff',a:.6});
}

function spawnChidori(x,y){
    for(let i=0;i<16;i++){
        const a=Math.random()*Math.PI*2;
        particles.push({x,y,vx:Math.cos(a)*(3+Math.random()*5),vy:Math.sin(a)*(3+Math.random()*5),
            r:2+Math.random()*3,color:Math.random()>.4?'#a29bfe':'#fff',
            a:1,decay:.04,type:'dot',rot:0,rotV:0});
    }
    for(let i=0;i<8;i++)
        bolts.push({x,y,angle:Math.random()*Math.PI*2,len:22+Math.random()*45,life:14,a:1});
    jutsuRings.push({x,y,r:4,maxR:68,color:'#a29bfe',a:.85});
}

function spawnBlossoms(x,y){
    for(let i=0;i<22;i++){
        const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3;
        particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,
            r:4+Math.random()*5,color:Math.random()>.5?'#fd79a8':'#fab1d3',
            a:1,decay:.014,type:'petal',rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.14});
    }
    jutsuRings.push({x,y,r:4,maxR:60,color:'#fd79a8',a:.7});
}

function spawnDarkFlames(x,y){
    for(let i=0;i<24;i++){
        const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.2, s=2+Math.random()*5;
        particles.push({x:x+(Math.random()-.5)*32,y:y+8,
            vx:Math.cos(a)*s*.3,vy:Math.sin(a)*s-1.5,
            r:5+Math.random()*8,
            color:['#2d1b69','#6c3483','#4a1a5a','#c0392b'][Math.floor(Math.random()*4)],
            a:.9,decay:.016,type:'dot',rot:0,rotV:0});
    }
    jutsuRings.push({x,y,r:4,maxR:78,color:'#8e44ad',a:.8});
}

function tickFx(){
    particles=particles.filter(p=>p.a>.05);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.91;p.vy*=.91;p.r*=.96;p.a-=p.decay;p.rot+=p.rotV;});
    jutsuRings=jutsuRings.filter(r=>r.a>.02);
    jutsuRings.forEach(r=>{r.r+=(r.maxR-r.r)*.18;r.a*=.87;});
    bolts=bolts.filter(b=>b.life>0);
    bolts.forEach(b=>{b.life--;b.a=b.life/14;});
}

function drawFx(){
    jutsuRings.forEach(r=>{
        ctx.save(); ctx.globalAlpha=r.a;
        ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
        ctx.fillStyle=r.color+'33'; ctx.fill();
        ctx.strokeStyle=r.color; ctx.lineWidth=2; ctx.stroke();
        ctx.restore();
    });
    bolts.forEach(b=>{
        ctx.save(); ctx.globalAlpha=b.a;
        ctx.strokeStyle='#c8c0ff'; ctx.lineWidth=1.5;
        ctx.shadowColor='#a29bfe'; ctx.shadowBlur=6;
        ctx.beginPath(); ctx.moveTo(b.x,b.y);
        let cx=b.x,cy=b.y;
        for(let i=0;i<5;i++){
            cx+=Math.cos(b.angle+(Math.random()-.5)*1.4)*(b.len/5);
            cy+=Math.sin(b.angle+(Math.random()-.5)*1.4)*(b.len/5);
            ctx.lineTo(cx,cy);
        }
        ctx.stroke(); ctx.restore();
    });
    particles.forEach(p=>{
        ctx.save(); ctx.globalAlpha=p.a;
        if(p.type==='petal'){
            ctx.translate(p.x,p.y); ctx.rotate(p.rot);
            ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*.5,0,0,Math.PI*2);
            ctx.fillStyle=p.color; ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=p.color; ctx.fill();
        }
        ctx.restore();
    });
}

// ── Floating text ─────────────────────────────────────────────────
let floats=[];
function spawnFloat(x,y,text,color='#fff',size=22){
    floats.push({x,y:y-10,text,color,size,a:1,vy:-1.8});
}
function tickFloats(){ floats=floats.filter(f=>f.a>.05); floats.forEach(f=>{f.y+=f.vy;f.a-=.022;}); }
function drawFloats(){
    ctx.textAlign='center';
    floats.forEach(f=>{
        ctx.save(); ctx.globalAlpha=f.a;
        ctx.font=`bold ${f.size}px sans-serif`;
        ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.lineWidth=4;
        ctx.strokeText(f.text,f.x,f.y);
        ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
        ctx.restore();
    });
}

// ── Screen shake ──────────────────────────────────────────────────
let shake=0;
const triggerShake=a=>shake=Math.max(shake,a);

// ── Ground level (where character feet rest on the bg) ────────────
// bg.png shows dirt/grass with the battle area in roughly the bottom 65%
const GY = Math.floor(H * 0.73);   // feet Y

// ── Sprite drawing ────────────────────────────────────────────────

// Naruto – KCM mode: draw real sprite + animated orange chakra aura + orbiting truth-seeking balls
function drawNaruto(x, y, bob, t){
    const fy = y + bob;          // feet target (we anchor sprite bottom here)
    const sw = 72, sh = 108;     // sprite size on canvas
    const sx = x - sw/2, sy = fy - sh;

    // Pulsing KCM chakra aura underneath
    const pulse = .55 + .2*Math.sin(t*.07);
    const aurR  = sw*.75 + Math.sin(t*.09)*6;
    const aur = ctx.createRadialGradient(x, fy-sh*.45, 4, x, fy-sh*.45, aurR);
    aur.addColorStop(0, `rgba(255,140,0,${pulse*.7})`);
    aur.addColorStop(.5,`rgba(255,80,0,${pulse*.3})`);
    aur.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.save(); ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.ellipse(x, fy-sh*.4, aurR, aurR*.8, 0, 0, Math.PI*2);
    ctx.fillStyle=aur; ctx.fill(); ctx.restore();

    // Chakra wisps rising upward
    if(t%4===0 && Math.random()>.5){
        particles.push({
            x:x+(Math.random()-.5)*30, y:fy-20,
            vx:(Math.random()-.5)*.8, vy:-1.5-Math.random()*1.5,
            r:3+Math.random()*5,
            color:Math.random()>.5?'#ff8c00':'#ffd700',
            a:.7,decay:.025,type:'dot',rot:0,rotV:0
        });
    }

    // Truth-seeking balls orbiting (6 orbs)
    for(let i=0;i<6;i++){
        const angle = t*.035 + (i/6)*Math.PI*2;
        const orbitR = 44 + Math.sin(t*.05+i)*5;
        const ovalY  = .4;   // flatten orbit vertically
        const bx = x + Math.cos(angle)*orbitR;
        const by2= fy - sh*.55 + Math.sin(angle)*orbitR*ovalY;
        // Glow
        ctx.save(); ctx.globalAlpha=.35;
        const og=ctx.createRadialGradient(bx,by2,0,bx,by2,9);
        og.addColorStop(0,'#555'); og.addColorStop(1,'transparent');
        ctx.fillStyle=og; ctx.beginPath(); ctx.arc(bx,by2,9,0,Math.PI*2); ctx.fill();
        ctx.restore();
        // Orb
        ctx.beginPath(); ctx.arc(bx,by2,5.5,0,Math.PI*2);
        ctx.fillStyle='#1a1a1a'; ctx.fill();
        ctx.strokeStyle='#444'; ctx.lineWidth=.8; ctx.stroke();
    }

    // Shadow
    ctx.save(); ctx.globalAlpha=.3;
    ctx.beginPath(); ctx.ellipse(x,fy,22,5,0,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill(); ctx.restore();

    // Sprite (flip to face right / toward Madara)
    ctx.save();
    ctx.translate(x, fy);
    ctx.scale(-1,1);             // mirror: naruto.png faces left, game wants right
    ctx.drawImage(narutoImg, -sw/2, -sh, sw, sh);
    ctx.restore();
}

// Madara – red samurai armor: draw real sprite + dark aura + floating red particles
function drawMadara(x, y, bob, t, flash){
    const fy = y + bob;
    const sw = 80, sh = 120;
    const fy2 = fy - sh;

    // Dark chakra aura
    const pulse = .4 + .2*Math.sin(t*.06+1);
    const aurR  = sw*.7 + Math.sin(t*.08+1)*5;
    const aur = ctx.createRadialGradient(x, fy-sh*.45, 4, x, fy-sh*.45, aurR);
    aur.addColorStop(0, `rgba(140,0,0,${pulse*.8})`);
    aur.addColorStop(.6, `rgba(80,0,80,${pulse*.35})`);
    aur.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.ellipse(x, fy-sh*.42, aurR, aurR*.75, 0, 0, Math.PI*2);
    ctx.fillStyle=aur; ctx.fill(); ctx.restore();

    // Rinnegan eye glow rings (floating above)
    const rp = .3+.3*Math.sin(t*.07+1);
    ctx.save(); ctx.globalAlpha=rp*.7;
    ctx.strokeStyle='#9b59b6'; ctx.lineWidth=1.5;
    ctx.shadowColor='#9b59b6'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x, fy-sh*.78, 8,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    // Rising dark embers when active
    if(t%5===0 && Math.random()>.6){
        particles.push({
            x:x+(Math.random()-.5)*40, y:fy-10,
            vx:(Math.random()-.5)*.6, vy:-1.2-Math.random(),
            r:2+Math.random()*4,
            color:Math.random()>.5?'#6c3483':'#8b0000',
            a:.6,decay:.02,type:'dot',rot:0,rotV:0
        });
    }

    // Shadow
    ctx.save(); ctx.globalAlpha=.35;
    ctx.beginPath(); ctx.ellipse(x,fy,28,6,0,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill(); ctx.restore();

    // Flash tint overlay when hit
    if(flash){
        ctx.save(); ctx.globalAlpha=.45;
        ctx.fillStyle='#ff3333';
        ctx.beginPath(); ctx.ellipse(x, fy-sh*.45, sw/2+4, sh/2+4, 0, 0, Math.PI*2);
        ctx.fill(); ctx.restore();
    }

    // Sprite (flip to face left / toward Naruto)
    ctx.save();
    ctx.translate(x, fy);
    ctx.scale(-1,1);             // madara.png faces right, game wants him facing left
    ctx.drawImage(madaraImg, -sw/2, -sh, sw, sh);
    ctx.restore();
}

// SASUKE – canvas drawn (lightning/purple theme)
function drawSasuke(x, y, bob, t){
    const by=y+bob;
    // Idle glow
    const p=.5+.5*Math.sin(t*.06+2);
    ctx.save(); ctx.globalAlpha=.08+p*.12;
    const g=ctx.createRadialGradient(x,by,3,x,by,48);
    g.addColorStop(0,'#a29bfe'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,by,48,0,Math.PI*2); ctx.fill(); ctx.restore();

    ctx.save(); ctx.globalAlpha=.28;
    ctx.beginPath(); ctx.ellipse(x,GY,16,4,0,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill(); ctx.restore();

    ctx.fillStyle='#0a0a1a';
    ctx.beginPath(); ctx.roundRect(x-9,GY-5,9,7,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x+1,GY-5,9,7,2); ctx.fill();
    ctx.fillStyle='#1c2340';
    ctx.beginPath(); ctx.roundRect(x-8,by+9,7,GY-by-10,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x+1,by+9,7,GY-by-10,2); ctx.fill();
    ctx.fillStyle='#1f3088';
    ctx.beginPath(); ctx.roundRect(x-10,by-7,20,18,3); ctx.fill();
    ctx.fillStyle='#888'; ctx.beginPath(); ctx.roundRect(x-10,by+8,20,3,1); ctx.fill();
    ctx.fillStyle='#1f3088';
    ctx.beginPath(); ctx.roundRect(x-17,by-6,8,14,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x+9,by-6,8,14,2); ctx.fill();
    ctx.fillStyle='#f5cba7';
    ctx.beginPath(); ctx.arc(x-13,by+9,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+13,by+9,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f5cba7'; ctx.beginPath(); ctx.arc(x,by-17,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();
    ctx.moveTo(x-10,by-22); ctx.quadraticCurveTo(x-5,by-42,x+8,by-34);
    ctx.quadraticCurveTo(x+14,by-26,x+10,by-17); ctx.quadraticCurveTo(x+4,by-13,x-2,by-14);
    ctx.quadraticCurveTo(x-8,by-15,x-10,by-22); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+5,by-28); ctx.quadraticCurveTo(x+20,by-38,x+18,by-24); ctx.fill();
    ctx.fillStyle='#bdc3c7'; ctx.beginPath(); ctx.roundRect(x-12,by-24,24,6,1); ctx.fill();
    ctx.fillStyle='#1f3088'; ctx.fillRect(x-12,by-23,3,4); ctx.fillRect(x+9,by-23,3,4);
    ctx.strokeStyle='#555'; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.arc(x,by-21,3,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,by-18); ctx.lineTo(x,by-24); ctx.stroke();
    ctx.fillStyle='#cc0000';
    ctx.beginPath(); ctx.arc(x-4,by-17,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4,by-17,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(x-4,by-17,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4,by-17,1,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

// SAKURA – canvas drawn (pink/green theme)
function drawSakura(x, y, bob, t){
    const by=y+bob;
    const p=.5+.5*Math.sin(t*.055+4);
    ctx.save(); ctx.globalAlpha=.07+p*.1;
    const g=ctx.createRadialGradient(x,by,3,x,by,44);
    g.addColorStop(0,'#fd79a8'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,by,44,0,Math.PI*2); ctx.fill(); ctx.restore();

    ctx.save(); ctx.globalAlpha=.25;
    ctx.beginPath(); ctx.ellipse(x,GY,14,4,0,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill(); ctx.restore();

    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.roundRect(x-7,GY-4,8,6,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x+1,GY-4,8,6,2); ctx.fill();
    ctx.fillStyle='#c0392b';
    ctx.beginPath(); ctx.moveTo(x-10,by+9); ctx.lineTo(x-12,GY-1); ctx.lineTo(x+12,GY-1); ctx.lineTo(x+10,by+9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x-10,by-7,20,18,3); ctx.fill();
    ctx.fillStyle='#f0f0f0'; ctx.beginPath(); ctx.roundRect(x-4,by-7,8,10,2); ctx.fill();
    ctx.fillStyle='#c0392b';
    ctx.beginPath(); ctx.roundRect(x-15,by-6,7,14,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x+8,by-6,7,14,2); ctx.fill();
    ctx.fillStyle='#f5cba7';
    ctx.beginPath(); ctx.arc(x-11,by+9,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+11,by+9,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f5cba7'; ctx.beginPath(); ctx.arc(x,by-16,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e84393';
    ctx.beginPath(); ctx.arc(x,by-20,12,Math.PI*.85,Math.PI*2.15); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-9,by-18); ctx.quadraticCurveTo(x-17,by-21,x-14,by-9); ctx.quadraticCurveTo(x-11,by-4,x-7,by-8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+9,by-18); ctx.quadraticCurveTo(x+17,by-21,x+14,by-9); ctx.quadraticCurveTo(x+11,by-4,x+7,by-8); ctx.fill();
    ctx.fillStyle='#f8c8e0'; ctx.beginPath(); ctx.arc(x,by-26,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#bdc3c7'; ctx.beginPath(); ctx.roundRect(x-12,by-23,24,5,1); ctx.fill();
    ctx.fillStyle='#c0392b'; ctx.fillRect(x-12,by-22,3,3); ctx.fillRect(x+9,by-22,3,3);
    ctx.fillStyle='#27ae60';
    ctx.beginPath(); ctx.arc(x-4,by-16,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4,by-16,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(x-4,by-16,1.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4,by-16,1.2,0,Math.PI*2); ctx.fill();
}

// HP bar
function drawHpBar(x,y,w,hp,maxHp,col){
    const bx=x-w/2, bh=7, r=hp/maxHp;
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(bx-1,y-1,w+2,bh+2);
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,y,w,bh);
    ctx.fillStyle=r>.5?col:r>.25?'#f39c12':'#e74c3c';
    ctx.fillRect(bx,y,w*r,bh);
    ctx.font='bold 9px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=3;
    ctx.fillText(`${hp}/${maxHp}`,x,y+bh+11); ctx.shadowBlur=0;
}

// Storm gauge
function drawStormGauge(){
    const gx=W/2-94,gy=8,gw=188,gh=14;
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(gx-1,gy-1,gw+2,gh+2);
    ctx.fillStyle='#111'; ctx.fillRect(gx,gy,gw,gh);
    const g=ctx.createLinearGradient(gx,0,gx+gw,0);
    g.addColorStop(0,'#f39c12'); g.addColorStop(1,'#e74c3c');
    ctx.fillStyle=g; ctx.fillRect(gx,gy,(stormGauge/100)*gw,gh);
    ctx.font='bold 8px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=4;
    ctx.fillText('STORM GAUGE',W/2,gy+11); ctx.shadowBlur=0;
}

// ── Game State ─────────────────────────────────────────────────────
let stormGauge=0, hitCombo=0;
let playerTurn=true, turnMoveUsed=false, isUltActive=false, gameOver=false;
let tick=0, ultFlash=0;

const lead={
    name:'Naruto', x:175, y:GY,
    radius:22, range:115,
    hp:550, maxHp:550, atk:48, bob:0
};
const enemy={
    name:'Madara', x:625, y:GY,
    radius:30, hp:1400, maxHp:1400, atk:45,
    flashTimer:0, bob:0
};
const supports=[
    { name:'Sasuke', atk:85, heal:0, radius:18,
      homeX:-90, homeY:GY, x:-90, y:GY, targetX:0, targetY:0,
      active:false, timer:0, cdMax:3, cdLeft:0, bob:0,
      cardEl:document.getElementById('sup0'), cdEl:document.getElementById('cd0'),
      jutsu:spawnChidori },
    { name:'Sakura', atk:60, heal:60, radius:18,
      homeX:-90, homeY:GY, x:-90, y:GY, targetX:0, targetY:0,
      active:false, timer:0, cdMax:2, cdLeft:0, bob:0,
      cardEl:document.getElementById('sup1'), cdEl:document.getElementById('cd1'),
      jutsu:spawnBlossoms }
];

// ── Drag ──────────────────────────────────────────────────────────
let isDragging=false, dragOX=0, dragOY=0, dragSX=0, dragSY=0;
let trail=[];

function toCanvas(e){
    const r=canvas.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)};
}
function onStart(e){
    if(!playerTurn||isUltActive||gameOver||!gameReady) return;
    if(turnMoveUsed){log('Already moved! Wait for enemy turn.');return;}
    const p=toCanvas(e);
    if(Math.hypot(p.x-lead.x,p.y-lead.y)<lead.radius+24){
        isDragging=true; dragOX=p.x-lead.x; dragOY=p.y-lead.y;
        dragSX=lead.x; dragSY=lead.y; trail=[];
    }
}
function onMove(e){
    if(!isDragging) return; if(e.cancelable) e.preventDefault();
    const p=toCanvas(e);
    lead.x=clamp(p.x-dragOX,lead.radius,W-lead.radius);
    lead.y=clamp(p.y-dragOY,lead.radius,H-75-lead.radius);
    trail.push({x:lead.x,y:lead.y}); if(trail.length>20) trail.shift();
}
function onEnd(){
    if(!isDragging) return; isDragging=false;
    if(Math.hypot(lead.x-dragSX,lead.y-dragSY)>4){turnMoveUsed=true;resolveAttack();}
    trail=[];
}
canvas.addEventListener('mousedown',onStart);
canvas.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onEnd);
canvas.addEventListener('touchstart',onStart,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onEnd);

// ── Combat ────────────────────────────────────────────────────────
function resolveAttack(){
    const dist=Math.hypot(enemy.x-lead.x,enemy.y-lead.y);
    if(dist<=lead.range+enemy.radius){
        hitCombo++; const dmg=lead.atk+rng(0,18);
        dealDmg(dmg); addGauge(13); triggerShake(5);
        spawnRasengan(enemy.x,enemy.y);
        spawnFloat(enemy.x,enemy.y-60,`-${dmg}`,'#f1c40f',26);
        log(`⚔️ Rasengan! Combo ×${hitCombo} — ${dmg} DMG`);
        if(hitCombo%2===0){
            const idx=(Math.floor(hitCombo/2)%2===1)?0:1;
            if(!supports[idx].active&&supports[idx].cdLeft===0)
                setTimeout(()=>assistSupport(idx),420);
        }
        setTimeout(endPlayerTurn,900);
    } else {
        hitCombo=0;
        log('Too far! Drag Naruto closer to Madara.');
        setTimeout(endPlayerTurn,700);
    }
}

function dealDmg(dmg){
    enemy.hp=Math.max(0,enemy.hp-dmg); enemy.flashTimer=14;
    if(enemy.hp===0&&!gameOver){gameOver=true;setTimeout(()=>log('🏆 VICTORY! Madara has been defeated!'),300);}
}

function assistSupport(idx){
    if(gameOver) return;
    const s=supports[idx]; if(s.active) return;
    s.active=true; s.timer=55; s.x=s.homeX; s.y=s.homeY;
    s.targetX=enemy.x-72+rng(-10,10); s.targetY=enemy.y+rng(-15,15);
    const dmg=s.atk+rng(0,20); dealDmg(dmg);
    addGauge(9); triggerShake(4);
    setTimeout(()=>s.jutsu(enemy.x,enemy.y),220);
    spawnFloat(enemy.x+20,enemy.y-65,`-${dmg}`,s.name==='Sasuke'?'#a29bfe':'#fd79a8',20);
    if(s.heal>0){
        lead.hp=Math.min(lead.maxHp,lead.hp+s.heal);
        spawnPfx(lead.x,lead.y,'#2ecc71',8,3);
        spawnFloat(lead.x,lead.y-52,`+${s.heal} HP`,'#2ecc71',16);
        log(`💥 Sakura: ${dmg} DMG + heals Naruto ${s.heal} HP!`);
    } else {
        log(`💥 Sasuke — Chidori for ${dmg} DMG!`);
    }
}

function callSupport(idx){
    if(!playerTurn||gameOver||isUltActive||!gameReady) return;
    const s=supports[idx];
    if(s.cdLeft>0){log(`${s.name} recharging (${s.cdLeft} turns)`);return;}
    if(s.active) return;
    assistSupport(idx); s.cdLeft=s.cdMax; refreshUI(idx);
}

function endPlayerTurn(){
    if(gameOver) return; playerTurn=false; turnMoveUsed=false;
    setBadge('ENEMY TURN','#e74c3c'); setTimeout(enemyTurn,800);
}

function enemyTurn(){
    if(gameOver) return;
    const dist=Math.hypot(lead.x-enemy.x,lead.y-enemy.y);
    if(dist<130){
        const dmg=enemy.atk+rng(0,18); lead.hp=Math.max(0,lead.hp-dmg);
        triggerShake(7); spawnDarkFlames(lead.x,lead.y);
        spawnFloat(lead.x,lead.y-52,`-${dmg}`,'#e74c3c',22);
        log(`💀 Madara's dark jutsu! Naruto takes ${dmg} DMG!`);
        if(lead.hp===0&&!gameOver){gameOver=true;setTimeout(()=>log('💀 DEFEAT! Naruto has fallen...'),300);return;}
    } else {
        log("Madara advances... stay alert!");
    }
    supports.forEach((s,i)=>{if(s.cdLeft>0){s.cdLeft--;refreshUI(i);}});
    setTimeout(startPlayerTurn,1000);
}

function startPlayerTurn(){
    if(gameOver) return; playerTurn=true;
    setBadge('YOUR TURN','#2ecc71'); log('Your turn! Drag Naruto to attack.');
}

function addGauge(v){
    stormGauge=Math.min(100,stormGauge+v);
    if(stormGauge>=100){ultBtn.className='ready';ultBtn.textContent='SECRET JUTSU!';}
}

function triggerUltimate(){
    if(isUltActive||gameOver||!gameReady) return;
    isUltActive=true; playerTurn=false; stormGauge=0;
    ultBtn.className=''; ultBtn.textContent='LOCKED';
    setBadge('SECRET JUTSU!','#f1c40f');
    log('🌀 SECRET JUTSU — COMBINED STRIKE!');
    ultFlash=1.0;
    lead.x=enemy.x-80; lead.y=enemy.y;
    supports.forEach((s,i)=>{
        s.active=true; s.timer=120; s.x=s.homeX; s.y=s.homeY;
        s.targetX=enemy.x-92; s.targetY=enemy.y+(i===0?-65:65);
    });
    triggerShake(12);
    setTimeout(()=>{
        const dmg=Math.floor(lead.atk*3.8+supports[0].atk*2.5+supports[1].atk*2.5);
        dealDmg(dmg);
        spawnRasengan(enemy.x,enemy.y);
        setTimeout(()=>spawnChidori(enemy.x,enemy.y),180);
        setTimeout(()=>spawnBlossoms(enemy.x,enemy.y),360);
        triggerShake(16);
        spawnFloat(enemy.x,enemy.y-35,`-${dmg}`,'#f1c40f',36);
        log(`✨ COMBINED JUTSU — ${dmg} TOTAL DMG!!`);
        setTimeout(()=>{isUltActive=false;hitCombo=0;if(!gameOver)startPlayerTurn();},900);
    },1300);
}

function refreshUI(idx){
    const s=supports[idx];
    if(s.cdLeft>0){
        s.cardEl.className='sup-card cd';
        s.cdEl.style.height=((s.cdLeft/s.cdMax)*100)+'%';
        s.cdEl.textContent=s.cdLeft;
    } else {
        s.cardEl.className='sup-card ready';
        s.cdEl.style.height='0%'; s.cdEl.textContent='';
    }
}

// Drag range circle + motion trail
function drawDragUI(){
    if(!isDragging) return;
    const inRange=Math.hypot(enemy.x-lead.x,enemy.y-lead.y)<=lead.range+enemy.radius;
    for(let i=1;i<trail.length;i++){
        ctx.save(); ctx.globalAlpha=(i/trail.length)*.35;
        ctx.strokeStyle='#ff8c00'; ctx.lineWidth=7*(i/trail.length);
        ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
        ctx.restore();
    }
    ctx.beginPath(); ctx.arc(lead.x,lead.y,lead.range,0,Math.PI*2);
    ctx.fillStyle=inRange?'rgba(46,204,113,.06)':'rgba(255,140,0,.05)'; ctx.fill();
    ctx.setLineDash([6,5]);
    ctx.strokeStyle=inRange?'rgba(46,204,113,.55)':'rgba(255,140,0,.4)';
    ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(lead.x,lead.y); ctx.lineTo(enemy.x,enemy.y);
    ctx.strokeStyle=inRange?'rgba(46,204,113,.35)':'rgba(231,76,60,.25)';
    ctx.lineWidth=1; ctx.stroke();
}

// ── Main Loop ──────────────────────────────────────────────────────
function frame(){
    tick++;
    lead.bob   = Math.sin(tick*.055)*4;
    enemy.bob  = Math.sin(tick*.045+1)*5;
    supports[0].bob=Math.sin(tick*.06+2)*3;
    supports[1].bob=Math.sin(tick*.05+3)*3;

    let sx=0,sy=0;
    if(shake>0){sx=(Math.random()*2-1)*shake;sy=(Math.random()*2-1)*shake;shake*=.78;if(shake<.4)shake=0;}

    ctx.save(); ctx.translate(sx,sy);

    // ── Background ──
    if(assetsReady>0){
        ctx.drawImage(bgImg,0,0,W,H);
    } else {
        ctx.fillStyle='#1a2a10'; ctx.fillRect(0,0,W,H);
        ctx.font='20px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
        ctx.fillText('Loading…',W/2,H/2);
    }

    if(!gameReady){ ctx.restore(); requestAnimationFrame(frame); return; }

    drawStormGauge();
    drawDragUI();

    // Combo counter
    if(hitCombo>1){
        ctx.save(); ctx.globalAlpha=.92;
        ctx.font=`bold ${14+hitCombo*.5}px sans-serif`;
        ctx.fillStyle='#f1c40f'; ctx.textAlign='left';
        ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=6;
        ctx.fillText(`COMBO ×${hitCombo}`,12,H-82); ctx.shadowBlur=0;
        ctx.restore();
    }

    // Supports
    supports.forEach((s,si)=>{
        if(!s.active) return;
        s.timer--; s.x+=(s.targetX-s.x)*.14; s.y+=(s.targetY-s.y)*.14;
        if(s.timer<=0){s.targetX=s.homeX;s.targetY=s.homeY;if(Math.abs(s.x-s.homeX)<4){s.active=false;s.x=s.homeX;s.y=s.homeY;}}
        if(si===0) drawSasuke(s.x,s.y,s.bob,tick);
        else       drawSakura(s.x,s.y,s.bob,tick);
    });

    // Enemy
    if(enemy.flashTimer>0) enemy.flashTimer--;
    const eJitter=enemy.flashTimer>0?(Math.random()*4-2):0;
    drawMadara(enemy.x+eJitter,enemy.y,enemy.bob,tick,enemy.flashTimer>0);
    drawHpBar(enemy.x,enemy.y+10,110,enemy.hp,enemy.maxHp,'#2ecc71');

    // Lead
    drawNaruto(lead.x,lead.y,lead.bob,tick);
    drawHpBar(lead.x,lead.y+10,90,lead.hp,lead.maxHp,'#3498db');

    // FX
    tickFx(); drawFx();
    tickFloats(); drawFloats();

    // Ultimate white flash
    if(ultFlash>0){
        ctx.save(); ctx.globalAlpha=ultFlash*.88;
        ctx.fillStyle='#ffffff'; ctx.fillRect(-10,-10,W+20,H+20);
        ctx.restore(); ultFlash-=.045;
    }

    // Game over
    if(gameOver){
        ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(-10,-10,W+20,H+20);
        const won=enemy.hp===0;
        ctx.textAlign='center'; ctx.shadowBlur=32;
        ctx.shadowColor=won?'#f1c40f':'#e74c3c';
        ctx.font='bold 54px sans-serif'; ctx.fillStyle=won?'#f1c40f':'#e74c3c';
        ctx.fillText(won?'VICTORY!':'DEFEAT',W/2,H/2);
        ctx.shadowBlur=0; ctx.font='15px sans-serif'; ctx.fillStyle='#aaa';
        ctx.fillText('Refresh to play again',W/2,H/2+38);
    }

    ctx.restore();
    requestAnimationFrame(frame);
}

refreshUI(0); refreshUI(1);
setBadge('YOUR TURN','#2ecc71');
frame();
</script>
